<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<script>
// shweu.app/@name (profile @username, 2026-11-17): GitHub Pages has no such page, so this
// 404 page sends it on to the profile page, which looks the name up.
// A trailing "." (a full stop taken into the link by a chat app) is dropped (review 2026-11-18).
(function(){var m=location.pathname.match(/^\/@([A-Za-z0-9_]{1}[A-Za-z0-9_.]{2,19})\.*\/?$/);
// Only the language is passed on: any other query (e.g. ?u=) must not change whose profile opens.
if(m){var l=new URLSearchParams(location.search).get("lang");
location.replace("/p/?h="+encodeURIComponent(m[1].toLowerCase().replace(/\.+$/,""))+((l==="my"||l==="en")?"&lang="+l:""));}})();
</script>
