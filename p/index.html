<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="/styles.css">

<style>
.pf-av{width:112px;height:112px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#F5E6C8;box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--gold);overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover;display:block}
.pf-role{display:inline-block;margin-top:8px;background:#F5E6C8;border-radius:12px;padding:0 12px;font-size:13.5px}
.pf-role[hidden],.pf-av img[hidden],.pf-av svg[hidden]{display:none}
.pf-handle{font-size:14px;opacity:.75;margin-top:-6px}
.pf-handle[hidden]{display:none}
.pf-about{white-space:pre-line;max-height:8.5em;overflow:hidden}
.pf-fail{color:var(--maroon2);font-weight:700}
.fb-btn[hidden],#avatar-x[hidden]{display:none}
.fb-btn.line{background:none;border:2px solid var(--gold);margin-top:14px}
</style>
</head>
